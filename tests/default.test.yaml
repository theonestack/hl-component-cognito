test_metadata:
  type: config
  name: default
  description: default cognito configuration test

pool_name: test-user-pool
alias_attributes:
  - email

user_schema:
  email:
    type: String
    mutable: true
    required: true
  name:
    type: String
    mutable: true
    required: true

default_client:
  name: test-client
  generate_secret: true
  output_secret: true
  callback_urls:
    - http://localhost:3000
  logout_urls:
    - http://localhost:3000/logout
  default_redirect_uri: http://localhost:3000/
  allowed_oauth_scopes:
    - openid
    - profile
  refresh_token_validity: 30
  allowed_oauth_flows_userpool_client: true
  allowed_oauth_flows:
    - client_credentials
  explicit_auth_flows: []
  skip_update: false
  allow_cognito_idp: true

default_user_group:
  name: default_group
  description: Default user group
  precedence: 10
